name: WebGIS production

on:
  push:
    branches: [sync-local-webgis]

  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: 'Konfirmasi sebelum menjalankan deployment produksi'
        required: true
        type: choice
        options:
          - 'NO - DO NOT DEPLOY'
          - 'DEPLOY PRODUCTION'
        default: 'NO - DO NOT DEPLOY'

permissions:
  contents: read

concurrency:
  group: webgis-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, mbstring, pdo_mysql, pdo_sqlite, xml
          coverage: none
          tools: composer:v2

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install locked dependencies and build assets
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash -n .github/scripts/deploy.sh
          composer install --no-interaction --no-progress --prefer-dist
          npm ci
          npm run build
          test -s public/build/manifest.json

      - name: Run automated tests on in-memory SQLite
        run: |
          set -euo pipefail
          APP_KEY="base64:$(openssl rand -base64 32)" vendor/bin/phpunit

      - name: Package the tested release
        id: package
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          paths=(app artisan bootstrap composer.json composer.lock config database/factories
                 database/migrations database/seeders public resources routes)
          if [[ -n "$(git ls-files --cached --ignored --exclude-standard -- "${paths[@]}")" ]]; then
            echo "A tracked release file matches a Git ignore rule. Review it before deployment." >&2
            exit 1
          fi
          git archive "$GITHUB_SHA" -- "${paths[@]}" | tar -xC "$stage"
          cp -R public/build "$stage/public/"
          (
            cd "$stage"
            composer install --no-dev --no-interaction --no-progress --prefer-dist \
              --no-scripts --no-plugins --optimize-autoloader
            composer check-platform-reqs --no-dev
          )
          # Link shared production state on the server after validating the archive.
          test ! -e "$stage/.env"
          test ! -e "$stage/storage"
          test ! -e "$stage/public/hot"
          test ! -e "$stage/public/storage"
          if [[ -n "$(find "$stage" -type l -print -quit)" ]]; then
            echo "The release contains a symbolic link; check its target before publishing." >&2
            exit 1
          fi
          tar -czf "$RUNNER_TEMP/release.tar.gz" -C "$stage" .
          digest="$(sha256sum "$RUNNER_TEMP/release.tar.gz" | cut -d ' ' -f 1)"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Save the release for this run
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webgis-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  deploy:
    needs: build
    # Production deployment requires an explicitly confirmed manual dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/sync-local-webgis' &&
      inputs.confirm_production_deploy == 'DEPLOY PRODUCTION'
    environment:
      name: production
      url: https://desa.pilangsari.id
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the release installer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Download this run's tested archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/webgis-artifact
          digest-mismatch: error

      - name: Verify archive integrity and current production branch
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/webgis-artifact"
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  release.tar.gz\n' "$EXPECTED_SHA256" | sha256sum --check --status
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/sync-local-webgis" --jq '.object.sha')"
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo "This release is no longer the head of the production branch." >&2
            exit 1
          fi

      - name: Send the private archive and activate the release over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          RELEASE_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$SSH_USER" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_-]*$ ]]
          [[ "$SSH_PORT" =~ ^[1-9][0-9]{0,4}$ ]] && (( SSH_PORT <= 65535 )) || exit 1
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$RELEASE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]]
          ssh_dir="$(mktemp -d)"
          trap 'rm -f -- "$ssh_dir/key" "$ssh_dir/known_hosts"; rmdir -- "$ssh_dir"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$ssh_dir/known_hosts"
          unset SSH_PRIVATE_KEY SSH_KNOWN_HOSTS
          connect() {
            ssh -F /dev/null -T -p "$SSH_PORT" -i "$ssh_dir/key" -o BatchMode=yes \
              -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UpdateHostKeys=no \
              -o GlobalKnownHostsFile=/dev/null -o "UserKnownHostsFile=$ssh_dir/known_hosts" \
              -o ForwardAgent=no -o ConnectTimeout=15 -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=3 -o LogLevel=QUIET -- "$SSH_USER@$SSH_HOST" "$@"
          }
          incoming="$(connect 'set -eu; umask 077; cd -P -- "$HOME"; mktemp -d .webgis-upload.XXXXXXXXXXXX')"
          [[ "$incoming" =~ ^\.webgis-upload\.[A-Za-z0-9]{12}$ ]]
          remote_file='"$HOME/'"$incoming"'/release.tar.gz"'
          cleanup() {
            connect "rm -f -- $remote_file && rmdir -- \"\$HOME/$incoming\"" </dev/null || true
            rm -f -- "$ssh_dir/key" "$ssh_dir/known_hosts"
            rmdir -- "$ssh_dir"
          }
          trap cleanup EXIT
          connect "umask 077; cat > $remote_file" < "$RUNNER_TEMP/webgis-artifact/release.tar.gz"
          connect "bash -s -- $remote_file $RELEASE_SHA256 $GITHUB_SHA" < .github/scripts/deploy.sh
